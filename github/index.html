<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>GitHub Trending · 历史归档</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <span class="logo">📊</span>
        <div>
          <h1>GitHub Trending · 历史归档</h1>
          <p class="tagline">每日 GitHub 热门仓库精选 · 自动生成</p>
        </div>
      </div>
      <nav class="archive-nav">
        <a href="../index.html">📰 新闻归档</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="hero">
      <h2>📚 历史归档</h2>
      <p class="hero-summary">所有已发布的 GitHub Trending 早报。</p>
    </section>
    <div class="archive-list" id="archive-list">
      <p style="text-align:center;color:var(--text-soft);">加载中...</p>
    </div>
  </main>
  <script>
    fetch('../github/index.json')
      .then(r => r.ok ? r.json() : [])
      .then(list => {
        const c = document.getElementById('archive-list');
        if (!list.length) {
          c.innerHTML = '<p style="text-align:center;color:var(--text-dim);">暂无历史归档</p>';
          return;
        }
        c.innerHTML = list.reverse().map(item => `
          <div class="archive-item">
            <a href="${item.file}">${item.title}</a>
            <span class="archive-meta">${item.count} 个仓库 · ${item.date}</span>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('archive-list').innerHTML =
          '<p style="text-align:center;color:var(--text-dim);">暂无历史归档</p>';
      });
  </script>
  <footer class="site-footer">
    <p>由 Hermes Agent 每日自动生成 · 数据来源 GitHub Trending · 仅供学习参考</p>
  </footer>
</body>
</html>
